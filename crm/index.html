<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#120b09">
  <title>Escape Hub 13 · العملاء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="crm.css">
</head>
<body class="is-gate">
  <!-- The venue at night, under a veil a torch opens (crm/backdrop.js). -->
  <div class="backdrop" aria-hidden="true"><div class="backdrop__photo"></div><div class="backdrop__veil"></div><div class="backdrop__glow"></div><div class="backdrop__grain"></div></div>
  <!-- One account per person (crm/accounts.js). Still a curtain, not a lock: demo data only. The real CRM sits in the
       staff panel behind its sign-in with a second step (decision T11). -->
  <form class="gate" data-gate>
    <p class="gate__brand">Escape Hub 13</p>
    <h1 class="gate__title">لوحة العملاء</h1>
    <label class="gate__label" for="user">الحساب</label>
    <select class="gate__input" id="user" name="user" autocomplete="username" required data-users>
      <option value="">اختار الحساب</option>
    </select>
    <label class="gate__label" for="pass">الباسورد</label>
    <input class="gate__input" id="pass" name="pass" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">ادخل</button>
    <p class="gate__help" data-gate-help aria-live="polite"></p>
  </form>

  <div class="shell" data-app hidden>
    <aside class="side" data-side aria-label="أقسام اللوحة">
      <div class="side__brand">
        <p class="side__name">Escape Hub 13</p>
        <p class="side__sub">لوحة العملاء والوردية</p>
      </div>
      <nav class="nav" data-nav></nav>
      <div class="me">
        <div class="who" data-me></div>
        <button class="btn btn--small btn--ghost" type="button" data-out>اخرج</button>
      </div>
      <label class="as" data-preview hidden>
        <span>جرّب اللوحة بعين</span>
        <select data-role></select>
        <span class="side__note">للأونر بس: يشوف كل حساب بيشوف إيه بالظبط.</span>
      </label>
      <div class="side__tools">
        <button class="btn btn--small btn--ghost" type="button" data-tour-start>جولة في اللوحة</button>
        <button class="btn btn--small btn--ghost" type="button" data-demo-switch hidden></button>
      </div>
    </aside>
    <button class="scrim" type="button" data-scrim aria-label="اقفل القايمة" hidden></button>

    <div class="main">
      <header class="bar">
        <button class="icon-btn bar__menu" type="button" data-menu aria-label="القايمة" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="bar__title">
          <h1 data-title>النهارده</h1>
          <p class="bar__sub" data-sub></p>
        </div>
        <form class="find" data-find role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
          <input type="search" name="q" placeholder="دوّر باسم أو رقم أو كود حجز" aria-label="دوّر على عميل أو حجز" autocomplete="off">
          <div class="find__list" data-find-list hidden></div>
        </form>
        <p class="demo" role="note" data-demo-note></p>
      </header>
      <main class="view" data-view tabindex="-1"></main>
    </div>

    <nav class="tabs" data-tabs aria-label="الأقسام الأساسية"></nav>
  </div>

  <dialog class="sheet" data-sheet aria-labelledby="sheet-title">
    <form method="dialog" class="sheet__inner" data-sheet-form>
      <header class="sheet__head">
        <h2 id="sheet-title" data-sheet-title></h2>
        <button class="icon-btn" value="cancel" formnovalidate aria-label="اقفل">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="sheet__body" data-sheet-body></div>
      <footer class="sheet__foot" data-sheet-foot></footer>
    </form>
  </dialog>

  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>

  <script src="accounts.js"></script>
  <script src="demo.js"></script>
  <script src="crm.js"></script>
  <script src="tour.js"></script>
  <script src="backdrop.js"></script>
</body>
</html>
